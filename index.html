<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manish Chaudhary</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0e0e0e;
      --text: #e8e8e8;
      --muted: #555;
      --border: rgba(255,255,255,0.08);
    }
    [data-theme="light"] {
      --bg: #f4f4f4;
      --text: #111;
      --muted: #aaa;
      --border: rgba(0,0,0,0.1);
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: Consolas, 'Courier New', monospace;
      transition: background 0.3s, color 0.3s;
    }

    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.8rem;
      border-bottom: 1px solid var(--border);
    }

    .nav-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
      transition: color 0.2s;
    }
    .nav-btn:hover { color: var(--text); }
    .nav-btn svg {
      width: 20px; height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    main {
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding: 0 2.4rem;
    }

    .block {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .line1 {
      font-size: clamp(1.6rem, 4.5vw, 3.2rem);
      font-weight: 700;
      letter-spacing: 0.03em;
      color: var(--text);
    }

    .line2 {
      font-size: clamp(0.65rem, 1.85vw, 1.32rem);
      font-weight: 400;
      font-style: normal;
      letter-spacing: 0.28em;
      color: var(--text);
    }
  </style>
</head>
<body>
  <nav>
    <!-- <a href="#" class="nav-btn" aria-label="Home">
      <svg viewBox="0 0 24 24">
        <path d="M3 12L12 4l9 8"/>
        <path d="M5 10v11h5v-6h4v6h5V10"/>
      </svg>
    </a> -->
    <button class="nav-btn" id="themeBtn" aria-label="Toggle theme">
      <svg id="iconMoon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg id="iconSun"  viewBox="0 0 24 24" style="display:none">
        <circle cx="12" cy="12" r="5"/>
        <line x1="12" y1="1"  x2="12" y2="3"/>
        <line x1="12" y1="21" x2="12" y2="23"/>
        <line x1="4.22" y1="4.22"   x2="5.64"  y2="5.64"/>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
        <line x1="1"  y1="12" x2="3"  y2="12"/>
        <line x1="21" y1="12" x2="23" y2="12"/>
        <line x1="4.22" y1="19.78" x2="5.64"  y2="18.36"/>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
      </svg>
    </button>
  </nav>

  <main>
    <div class="block">
      <div class="line1">No man has the right to be an amateur in the matter of physical training.
It is a shame for a man to grow old without seeing the beauty and strength of which his body is capable.</div>
      <!-- <div class="line2">STORY&nbsp;&nbsp;COMING&nbsp;&nbsp;SOON&nbsp;&nbsp;.&nbsp;.&nbsp;.&nbsp;.&nbsp;.</div> -->
    </div>
  </main>

  <script>
    const btn  = document.getElementById('themeBtn');
    const moon = document.getElementById('iconMoon');
    const sun  = document.getElementById('iconSun');
    const html = document.documentElement;

    applyTheme(localStorage.getItem('theme') || 'dark');

    btn.addEventListener('click', () => {
      const next = html.dataset.theme === 'dark' ? 'light' : 'dark';
      applyTheme(next);
      localStorage.setItem('theme', next);
    });

    function applyTheme(t) {
      html.dataset.theme = t;
      moon.style.display = t === 'dark'  ? 'block' : 'none';
      sun.style.display  = t === 'light' ? 'block' : 'none';
    }
  </script>
</body>
</html>
